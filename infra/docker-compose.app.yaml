services:
  app:
    build: ./..
    restart: always
    ports:
      - 8080:8080
    env_file:
      - ../.env
    environment:
      - POSTGRES_DSN=postgres://postgres:postgres@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 60s
      retries: 5
      start_period: 3s  
